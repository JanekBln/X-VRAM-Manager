name: Release X-VRAM v0.4.3

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v0.4.3.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.4.3 patch
        run: |
          git apply --check -p2 .github/v043_combined.patch
          git apply -p2 .github/v043_combined.patch

      - name: Commit v0.4.3 to main
        run: |
          rm -f .github/v043_combined.patch
          rm -f .github/workflows/release-v0.4.3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release X-VRAM Manager v0.4.3"
          git push origin HEAD:main

      - name: Build release ZIP
        run: |
          mkdir -p /tmp/xvram-release
          cp README.md /tmp/xvram-release/README.txt
          cp PI_XVRAM_Manager.py XVRAM_Manager.ini CHANGELOG.txt LICENSE.txt /tmp/xvram-release/
          cd /tmp/xvram-release
          zip -9 XVRAM_Manager_v0.4.3_Release.zip PI_XVRAM_Manager.py XVRAM_Manager.ini README.txt CHANGELOG.txt LICENSE.txt

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.4.3 >/dev/null 2>&1; then
            gh release upload v0.4.3 /tmp/xvram-release/XVRAM_Manager_v0.4.3_Release.zip --clobber
            gh release edit v0.4.3 --title "X-VRAM Manager v0.4.3" --notes-file RELEASE_NOTES_v0.4.3.md
          else
            gh release create v0.4.3 /tmp/xvram-release/XVRAM_Manager_v0.4.3_Release.zip --target main --title "X-VRAM Manager v0.4.3" --notes-file RELEASE_NOTES_v0.4.3.md
          fi
