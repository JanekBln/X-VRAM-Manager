name: Release X-VRAM v0.4.3

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v0.4.3.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.4.3 patch
        run: |
          git apply --check -p2 .github/v043_combined.patch
          git apply -p2 .github/v043_combined.patch
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('X-VRAM Manager v0.4.1', 'X-VRAM Manager v0.4.3')
          s = s.replace('- X-Plane 12.4.4-b1 build 124410', '- X-Plane 12.4.4-b3 build 124413')
          s = s.replace('[X-VRAM] v0.4.1 starting', '[X-VRAM] v0.4.3 starting')
          s = s.replace('Version 0.4.1 includes an optional in-sim VRAM monitor.', 'Version 0.4.3 includes an optional in-sim VRAM monitor.')
          section = '''\n\nTEXTURE LEVEL SWITCH\n--------------------\nThe VRAM Monitor includes a 32 / 64 LEVEL switch:\n\n32\n    Balanced mode. Keeps more VRAM headroom and is intended to reduce\n    aggressive texture-pager pressure and large pager swings.\n\n64\n    Aggressive mode. Allows maximum texture quality but can use more of\n    X-Plane's available texture budget.\n\nHover the LEVEL switch for a short in-sim explanation.\n\nThe selected level is saved to XVRAM_Manager.ini and is retained after restart.\nFUDGE remains unchanged at 0.75 when switching between 32 and 64.\n\nRESTORE still returns X-Plane to the captured stock pager values and disables\nX-VRAM runtime reassertion until APPLY or RELOAD is used again.\n'''
          if 'TEXTURE LEVEL SWITCH' not in s:
              s = s.rstrip() + section + '\n'
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit v0.4.3 to main
        run: |
          rm -f .github/v043_combined.patch
          rm -f .github/workflows/release-v0.4.3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release X-VRAM Manager v0.4.3"
          git push origin HEAD:main

      - name: Build release ZIP
        run: |
          mkdir -p /tmp/xvram-release
          cp README.md /tmp/xvram-release/README.txt
          cp PI_XVRAM_Manager.py XVRAM_Manager.ini CHANGELOG.txt LICENSE.txt /tmp/xvram-release/
          cd /tmp/xvram-release
          zip -9 XVRAM_Manager_v0.4.3_Release.zip PI_XVRAM_Manager.py XVRAM_Manager.ini README.txt CHANGELOG.txt LICENSE.txt

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.4.3 >/dev/null 2>&1; then
            gh release upload v0.4.3 /tmp/xvram-release/XVRAM_Manager_v0.4.3_Release.zip --clobber
            gh release edit v0.4.3 --title "X-VRAM Manager v0.4.3" --notes-file RELEASE_NOTES_v0.4.3.md
          else
            gh release create v0.4.3 /tmp/xvram-release/XVRAM_Manager_v0.4.3_Release.zip --target main --title "X-VRAM Manager v0.4.3" --notes-file RELEASE_NOTES_v0.4.3.md
          fi
