# X-VRAM Manager v0.3
# Conservative standalone profile for X-Plane 12.
#
# No Vulkan layer, no shader injection, no ReShade hook.

[general]
enabled = yes
restore_on_disable = yes

[pager]
# Optional in-memory reserve patch.
# It is applied ONLY if the exact known instruction signature is found once.
budget_reserve_mb = 512

# Main v0.3 tuning path.
fallback_controls = yes

# Conservative tested values.
max_overdrive = 64
size_fudge_factor = 0.75

# 0 = leave X-Plane's cooldown untouched.
downscale_cooldown = 0

# Reassert pager values periodically.
reassert_every_frames = 60

[advanced]
# KEEP AT 0 FOR NORMAL USE.
# 0 = keep X-Plane's stock texture-scale floor / emergency downscaling.
# Experimental values: 1.0, 0.5, 0.25, 0.125, 0.0625
scale_floor = 0

# Delay before optional scale_floor patch is attempted.
scale_floor_delay_frames = 900
